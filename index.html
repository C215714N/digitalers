<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://unpkg.com/bootstrap/dist/css/bootstrap.min.css">
    <script src="https://unpkg.com/bootstrap/dist/js/bootstrap.js"></script>
    <!-- ReactJS -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="module">
    // Modelos de datos
        const navigation = [
            {href: "/", text: "inicio", style: "nav-link"},
            {href: "/gallery", text: "galeria", style: "nav-link"},
            {href: "/contact", text: "contacto", style: "nav-link"},
        ]
        const social = [
            {href: "https://facebook.com/profile/", text: "facebook", style: "btn btn-outline-primary"},
            {href: "https://instagram.com/profile/", text: "instagram", style: "btn btn-outline-danger"},
            {href: "https://twitter.com/profile/", text: "twitter", style: "btn btn-outline-info"},
            {href: "https://whatsapp.com/profile/", text: "whatsapp", style: "btn btn-outline-success"},
        ]

    // Componentes
        const Button = ({variant="lg", size="", text="", classlist="", ...props}) => 
            React.createElement('button', {
                className: `btn btn-${variant} ${size ? `btn-${size}`: ''} ${classlist}`,
                type: 'button',
                ...props
            }, text );
        const Links = (array) => array.map(({href, text, style=""}) =>
            React.createElement('a', { className: style, href}, text));

    // Contenedores
        const Header = React.createElement('header', {
            className: 'd-grid justify-content-center align-content-center | min-vh-100 | bg-dark bg-gradient text-light'
            }, [
            React.createElement('h1', {className: 'display-1 fw-bold'},'Aplicacion ReactJS'),
            React.createElement('p', { className: 'h1 fw-light'},'Biblioteca javascript FrontEnd'),
            React.createElement('div',{ className: 'btn-group'}, [
                Button({text: 'iniciar sesion', variant: 'primary'}),
                Button({text: 'Registrarse', variant: 'success'})
            ])
        ]);
        const Nav = React.createElement('nav', { className: 'navbar navbar-dark navbar-expand-md | p-2 | bg-primary '},
            Button({classlist: 'navbar-brand', text: 'App'}),
            Button({
                classlist:'navbar-toggler navbar-toggler-icon',
                "data-bs-target": '#nav',
                "data-bs-toggle": "collapse",
            }),
            React.createElement('div', {id:'nav', className: 'navbar-nav navbar-collapse collapse'}, Links(navigation) )
        )
        const Social = React.createElement('div', { className: 'btn-group'}, Links(social))

    // Punto de entrada
        
    // Renderizado App
        ReactDOM.createRoot(document.getElementById('root'))
    </script>
</body>
</html>
